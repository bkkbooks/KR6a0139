body:
  text: 西晉三藏竺法護譯聞如是一時婆伽婆在舍衛城祇樹給孤獨園爾時世尊告諸比丘轉輪聖王有此四未曾有法云何為四於是轉輪聖王為人民類皆悉愛念未曾傷害譬如父子轉輪聖王亦復如是愛敬人民未曾有瞋怒向之譬如父有一子是謂轉輪聖王初未曾有法或復轉輪聖王遊人民間見皆歡喜如子親父是謂轉輪聖王二未曾有法復次轉輪聖王住不遊行時人民類其有覩者皆得歡喜彼轉輪聖王與人民說法其有聞者皆悉歡喜時人民聞轉輪聖王說法無有厭足是謂轉輪聖王三未曾有法復次轉輪聖王坐不遊行時人民類其有覩者皆悉歡喜彼轉輪聖王教勅人民此事可為此不可為此可親此不可親若為此事者長夜獲福無窮極若為此事長夜受苦亦無休息彼人民類聞轉輪聖王如此教勅喜無厭足是謂轉輪聖王有此未曾有法如是阿難比丘亦有四未曾有法云何為四於是阿難比丘若至比丘眾中諸比丘見皆悉歡喜彼阿難比丘為說法其聞法者皆悉歡喜諸比丘聞阿難所說無厭足是謂阿難比丘第一未曾有法若阿難比丘默然至比丘尼眾中其有見者皆悉歡喜彼阿難比丘為說法其聞法者皆得歡喜時比丘尼眾聞阿難說法不知厭足是謂阿難比丘第二未曾有法若復阿難默然至優婆塞處時優婆塞見皆歡喜彼阿難比丘為說法時優婆塞眾聞阿難所說無有厭足是謂阿難比丘第三未曾有法復次阿難比丘默然至優婆夷眾中彼眾見者皆悉歡喜彼阿難比丘為說法優婆夷聞者無有厭足是謂阿難比丘四未曾有法爾時諸比丘聞佛所說歡喜奉行右一經經名譯主諸藏皆同而國宋兩本文義全同始終唯說造塔功德末雖結名未曾有法然一經始末無四字之義此丹本經說轉輪聖王有四未曾有法以喻阿難亦有四未曾有法按開元錄若函中有四未曾有經云與增一阿含八難品同本異譯今撿之丹本即是也其國宋本經即前毀函中未曾有經後漢失譯人名出古舊錄者耳意者宋藏於此若函中失真四未曾有經而得毀函中未曾有經以為名脫四字遂加四字重編於此錯也噫此錯之失凡有四焉失真四未曾有經一也未曾有經一本重載二也又彼失譯而為法護譯三也彼是大乘而抑之編此小乘藏中四也故去宋經而取丹本後賢欲知今所去經是何等者請見毀函未曾有經即是耳
