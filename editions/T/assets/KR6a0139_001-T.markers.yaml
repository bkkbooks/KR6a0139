  - {type: variant, offset: 555, length: 258, content: 右一經，經名、譯主諸藏皆同，而國、宋兩本文義全同，始終唯說造塔功德，末雖結名未曾有法，然一經始末無四字之義，此丹本經，說轉輪聖王有四未曾有法，以喻阿難亦有四未曾有法。按《開元錄》「若」函中，有《四未曾有經》，云與《增一阿含．八難品》同本異譯。今撿之丹本，即是也；其國、宋本經，即前「毀」函中《未曾有經》，後漢失譯人名，出古舊錄者耳。意者宋藏於此「若」函中，失真《四未曾有經》，而得「毀」函中《未曾有經》，以為名脫四字，遂加四字重編於此，錯也。噫！此錯之失，凡有四焉：失真《四未曾有經》，一也；《未曾有經》一本重載，二也；又彼失譯而為法護譯，三也；彼是大乘而抑之編此小乘藏中，四也。故去宋經而取丹本，後賢欲知今所去經是何等者，請見「毀」函《未曾有經》，即是耳。, 宋: '', 元: '', 明: ''}
